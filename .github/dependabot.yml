version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /apps/admin
    schedule:
      interval: weekly
      day: monday
      time: "04:10"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /apps/webmail
    schedule:
      interval: weekly
      day: monday
      time: "04:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
