name: 部署求助
description: 安装 Loven7 Mail、连接 Cloudflare、自动 Email Routing 或真实收件时遇到问题。
title: "[部署]: "
labels: ["deployment"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已经阅读 docs/BEGINNER_GUIDE.md，并按自己的域名状态选择了正确入口。
        - label: 我已经核对域名为 Active，并按 docs/EMAIL_ROUTING.md 检查自动路由结果、邮件 DNS 和 Catch-all。
        - label: 我不会粘贴 Token、密码、JWT、Secret、私人域名、项目名或真实 Cloudflare 资源 ID。
  - type: dropdown
    id: deploy_mode
    attributes:
      label: 部署方式
      options:
        - Windows 单文件安装器
        - 下载或克隆源码后运行 npm run setup
        - 已有兼容 Worker，只部署 Admin 和 Webmail
        - GitHub Actions 自动部署
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 卡在哪一步？
      description: 请写出当前步骤和可见错误；域名、账号、项目名与敏感信息必须脱敏。
    validations:
      required: true
  - type: textarea
    id: runtime
    attributes:
      label: 运行时检查结果
      description: 如果有，请粘贴已脱敏的 npm run check:cloudflare、/api/runtime 或 Worker Logs 结果。
