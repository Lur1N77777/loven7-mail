<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f6f5f3" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("loven7.uiTheme");
          const theme = saved === "light" || saved === "dark"
            ? saved
            : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "dark" ? "#121110" : "#f6f5f3");
        } catch {}
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/pwa.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/pwa.svg" />
    <link rel="preload" href="/fonts/loven7-brand-script-latin-v2.woff2" as="font" type="font/woff2" crossorigin />
    <title>Loven7 Mail</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
